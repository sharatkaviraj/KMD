<style>
body{margin:0}
.vx,.vxt{--bg:#F4F7FA;--card:#FFFFFF;--s2:#F0F6F9;--s3:#E3EDF2;--fg:#151923;--mut:#5C6270;--sub:#8A8E98;--bd:#DCE4EA;--bds:#ACC0CD;--pri:#0B4F79;--prifg:#FFFFFF;--acc:#0E717C;--accs:#E6F6F7;--accfg:#0B5C65;--nav:#082F49;--navs:#153C56;--navb:#24465E;--navm:#AFC0CC;--navfg:#F7F6F3;--ok:#1B5F3E;--oks:#E9F8F0;--okm:#CDEFDD;--warn:#A95C0F;--warns:#FEF5E7;--warnfg:#83470B;--warnm:#F6D9A8;--bad:#B41D1D;--bads:#FDEEEE;--info:#1D48A5;--infos:#EEF3FE;--c1:#0B4F79;--c2:#2A9DA8;--c3:#E0A042;--c4:#A9BCC9;--heat:14,113,124;--glass:rgba(244,247,250,.86);--glass2:rgba(255,255,255,.9);--scrim:rgba(8,20,30,.45);--wabg:#ECE5DD;--wab:#DCF8C6;--wafg:#111B21;--sh:0 1px 2px rgba(21,25,35,.04),0 12px 28px -18px rgba(21,25,35,.28);--shh:0 2px 4px rgba(21,25,35,.05),0 20px 40px -18px rgba(21,25,35,.36);--shl:0 30px 80px -24px rgba(8,20,30,.5);--onsolid:#FFFFFF;--tbg:#151923;--tfg:#F7F6F3;--tacc:#81DAE4;--tacs:rgba(129,218,228,.16);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.36,.64,1)}
.vx.dark,.vxt.dark{--bg:#0E1117;--card:#161A22;--s2:#1C212B;--s3:#262C37;--fg:#F3F1EC;--mut:#B3AFA4;--sub:#8E8A80;--bd:#2A303B;--bds:#3B4250;--pri:#81DAE4;--prifg:#08202A;--acc:#81DAE4;--accs:#123139;--accfg:#A9E9F0;--nav:#0A1824;--navs:#132D40;--navb:#21425A;--ok:#5FCB97;--oks:#122A22;--okm:#1D4A37;--warn:#F2A85A;--warns:#2E2318;--warnfg:#F6C88F;--warnm:#5B3F1E;--bad:#F27E7E;--bads:#33191C;--info:#8FB0F5;--infos:#18213A;--c1:#81DAE4;--c2:#3E9AA6;--c3:#F2A85A;--c4:#6E7F8C;--heat:129,218,228;--glass:rgba(14,17,23,.84);--glass2:rgba(22,26,34,.9);--scrim:rgba(0,0,0,.55);--wabg:#0B141A;--wab:#005C4B;--wafg:#E9EDEF;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.7);--shh:0 2px 4px rgba(0,0,0,.4),0 20px 40px -18px rgba(0,0,0,.8);--shl:0 30px 80px -24px rgba(0,0,0,.85);--onsolid:#10131A;--tbg:#F3F1EC;--tfg:#151923;--tacc:#0B5C65;--tacs:rgba(11,92,101,.12)}
.vx{container:vx/inline-size}
.vx,.vx *,.vxt,.vxt *{box-sizing:border-box}
.vx{transition:background-color .3s ease,color .3s ease}
.vx button,.vxt button{font-family:inherit;cursor:pointer}
.vx input,.vx textarea,.vx select{font-family:inherit;font-size:inherit;color:var(--fg)}
.vx input::placeholder,.vx textarea::placeholder{color:var(--sub)}
.vx :focus-visible,.vxt :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vx a,.vxt a{color:inherit;text-decoration:none}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--bds) transparent}
.hs{overflow-x:auto;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.tap{transition:transform .14s var(--ease),background-color .2s ease,color .2s ease,box-shadow .25s ease,opacity .2s ease,border-color .2s ease,filter .2s ease}
.tap:active{transform:scale(.97)}
.lift{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s ease}
.lift:hover{transform:translateY(-2px);box-shadow:var(--shh);border-color:var(--bds)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh)}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--pri);color:var(--prifg);border-color:var(--pri)}
.btn{height:40px;padding:0 16px;border-radius:12px;border:0;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.pri{background:var(--pri);color:var(--prifg)}
.pri:hover{filter:brightness(1.12)}
.sec{background:var(--card);color:var(--fg);border:1px solid var(--bds)}
.sec:hover{background:var(--s2)}
.soft{background:var(--accs);color:var(--accfg)}
.soft:hover{filter:brightness(.96)}
.ghost{background:transparent;color:var(--fg)}
.ghost:hover{background:var(--s2)}
.danger{background:var(--bad);color:var(--onsolid)}
.danger:hover{filter:brightness(1.08)}
.pill{height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.sech{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.serif{font-family:'Source Serif 4',Georgia,serif}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.k{font-family:Inter,sans-serif;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--mut)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:700;color:var(--mut)}
.inp{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--bds);background:var(--card);outline:none;transition:border-color .2s ease,box-shadow .2s ease;width:100%;font-size:15px}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.inp.err{border-color:var(--bad);box-shadow:0 0 0 3px var(--bads);animation:xShake .4s ease}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.row{transition:background-color .18s ease}
.row:hover{background:var(--s2)}
.row.sel{background:var(--accs)}
.sw{width:46px;height:28px;border-radius:14px;padding:3px;display:flex;flex:none;background:var(--bds);transition:background-color .25s ease}
.sw.on{background:var(--acc)}
.sw>span{width:22px;height:22px;border-radius:11px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s var(--spring)}
.sw.on>span{transform:translateX(18px)}
.seg{position:relative;display:grid;padding:3px;border-radius:12px;background:var(--s3)}
.seg>.thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--card);box-shadow:var(--sh);transition:transform .32s var(--spring)}
.seg>button{position:relative;height:34px;border:0;background:transparent;font-size:13px;font-weight:700;color:var(--mut);transition:color .2s ease}
.seg>button.on{color:var(--fg)}
.sidei{color:var(--navm)}
.sidei:hover{background:rgba(255,255,255,.07)}
.sidei.on{background:var(--navs);box-shadow:inset 0 0 0 1px var(--navb);color:#FFFFFF;font-weight:700}
.rise{animation:xRise .42s var(--ease) both}
.fadein{animation:xIn .32s var(--ease) both}
.push{animation:xPush .36s var(--ease) both}
.pop{animation:xPop .32s var(--ease) both}
.skel{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 37%,var(--s2) 63%);background-size:400% 100%;animation:xShimmer 1.4s ease infinite;border-radius:10px}
.scrim{position:absolute;top:0;left:0;right:0;bottom:0;z-index:50;border:0;padding:0;background:var(--scrim);cursor:default}
.scrim.open{animation:xFade .25s ease both}
.scrim.closing{animation:xOut .22s ease forwards}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:92%;display:flex;flex-direction:column;background:var(--card);border-radius:28px 28px 0 0;box-shadow:var(--shl);overflow:hidden}
.sheet.open{animation:xUp .42s var(--ease) both}
.sheet.closing{animation:xDown .24s var(--ease) forwards}
.grab{width:40px;height:5px;border-radius:3px;background:var(--bd);margin:8px auto 0;flex:none}
.toastwrap{position:absolute;left:0;right:0;bottom:92px;z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 14px}
.toast{pointer-events:auto;max-width:560px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;min-height:50px;border-radius:16px;background:var(--tbg);color:var(--tfg);box-shadow:var(--shl);animation:xToast .32s var(--spring) both}
.toast button{flex:none;height:36px;padding:0 14px;border:0;border-radius:10px;background:var(--tacs);color:var(--tacc);font-size:14px;font-weight:700}
@keyframes xIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes xFade{from{opacity:0}to{opacity:1}}
@keyframes xOut{from{opacity:1}to{opacity:0}}
@keyframes xRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes xPush{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes xPop{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes xUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes xDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes xModal{from{opacity:0;transform:translate(-50%,-47%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes xModalOut{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
@keyframes xMenu{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes xGrowY{from{transform:scaleY(0)}}
@keyframes xGrowX{from{transform:scaleX(0)}}
@keyframes xDraw{from{stroke-dashoffset:var(--len)}}
@keyframes xSpin{from{transform:rotate(-150deg) scale(.86);opacity:0}to{transform:rotate(-90deg);opacity:1}}
@keyframes xLoop{to{transform:rotate(360deg)}}
@keyframes xPulse{0%{box-shadow:0 0 0 0 rgba(14,113,124,.5)}70%{box-shadow:0 0 0 9px rgba(14,113,124,0)}100%{box-shadow:0 0 0 0 rgba(14,113,124,0)}}
@keyframes xPopIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes xLeave{0%{opacity:1;transform:none;max-height:220px}55%{opacity:0;transform:translateX(-28px);max-height:220px}100%{opacity:0;transform:translateX(-28px);max-height:0;padding-top:0;padding-bottom:0;border-width:0}}
@keyframes xToast{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes xShimmer{from{background-position:100% 0}to{background-position:0 0}}
@keyframes xShake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes xWave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes xRipple{from{transform:scale(1);opacity:.55}to{transform:scale(1.9);opacity:0}}
@keyframes xCaret{50%{opacity:0}}
@keyframes xTick{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@container vx (max-width:899px){.vx .only-d{display:none!important}.vx .g4{grid-template-columns:repeat(2,minmax(0,1fr))!important}.vx .g3,.vx .g2{grid-template-columns:minmax(0,1fr)!important}.vx .unstick{position:static!important;height:auto!important;max-height:none!important;border-left:0!important;border-top:1px solid var(--bd)}.vx .mfull{width:100%!important;max-width:none!important}.vx .hide-m{display:none!important}.vx .stack{grid-template-columns:minmax(0,1fr)!important}.vx .pad{padding-left:16px!important;padding-right:16px!important}.vx .btn{height:44px}.vx .chip{height:38px}.vx .inp{font-size:16px}}
@container vx (min-width:900px){.vx .only-m{display:none!important}.vx .hide-d{display:none!important}.vx .sheet{left:50%;right:auto;bottom:auto;top:50%;width:580px;max-width:calc(100% - 48px);max-height:86%;border-radius:22px;transform:translate(-50%,-50%)}.vx .sheet.wide{width:760px}.vx .sheet.open{animation:xModal .3s var(--ease) both}.vx .sheet.closing{animation:xModalOut .2s var(--ease) forwards}.vx .grab{display:none}.vx .toastwrap{bottom:28px}}

</helmet>
<aside class="vxt {{theme}}" aria-label="Main navigation" style="width: 248px; height: 100vh; display: flex; flex-direction: column; background: var(--nav); color: var(--navfg); padding: 14px 0 12px; font-family: Inter, 'Noto Sans Devanagari', system-ui, sans-serif; font-size: 14px; line-height: 1.4">
  <a href="{{home}}" style="flex: none; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; margin-bottom: 6px; color: var(--navfg)">
    <span class="serif" style="flex: none; width: 36px; height: 36px; border-radius: 11px; background: #F7F6F3; color: #082F49; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">VP</span>
    <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 700; font-size: 15px">VPPS One</span><span style="font-size: 12px; color: var(--navm)">{{roleLine}}</span></span>
  </a>
  <nav class="scroll" style="flex: 1; min-height: 0; padding: 2px 12px 8px; scrollbar-width: none">
    <sc-for list="{{items}}" as="n" hint-placeholder-count="12">
      <sc-if value="{{n.isH}}" hint-placeholder-val="{{ false }}"><div style="height: 28px; padding: 10px 12px 0; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--navm)">{{n.h}}</div></sc-if>
      <sc-if value="{{n.isI}}" hint-placeholder-val="{{ true }}">
        <a href="{{n.href}}" class="tap sidei {{n.cls}}" aria-current="{{n.current}}" style="position: relative; height: {{n.hgt}}; margin-bottom: 2px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 11px; font-size: {{n.fs}}; animation: {{n.anim}}">
          <svg class="i" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
          <span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.label}}</span><sc-if value="{{n.hasHi}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: var(--navm); font-weight: 500">{{n.hi}}</span></sc-if></span>
          <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="pill num" style="min-width: 22px; justify-content: center; background: #E05252; color: #FFFFFF">{{n.badge}}</span></sc-if>
        </a>
      </sc-if>
    </sc-for>
  </nav>
  <div style="flex: none; padding: 10px 12px 0; border-top: 1px solid var(--navb)">
    <a href="{{me.href}}" class="tap sidei" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px; border-radius: 12px">
      <span style="flex: none; width: 38px; height: 38px; border-radius: 19px; background: {{me.bg}}; color: #082F49; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{me.ini}}</span>
      <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: var(--navfg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{me.name}}</span><span style="font-size: 12px; color: var(--navm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{me.sub}}</span></span>
    </a>
  </div>
</aside>
</x-dc>
