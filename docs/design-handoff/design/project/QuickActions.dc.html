<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick actions sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Devanagari:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E717C}a:hover{color:#0B5C65}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F7FAFC; color: #151923; font-family: Inter, 'Noto Sans Devanagari', system-ui, sans-serif">

  <div aria-hidden="true" style="background: #082F49; height: 300px; padding: 70px 20px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <div style="width: 120px; height: 12px; border-radius: 6px; background: #2F556F"></div>
    <div style="width: 240px; height: 22px; border-radius: 8px; background: #2F556F"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px">
      <div style="height: 80px; border-radius: 14px; background: #153C56"></div>
      <div style="height: 80px; border-radius: 14px; background: #153C56"></div>
    </div>
  </div>

  <a href="Main.dc.html" aria-label="Close quick actions" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8, 20, 30, 0.58)"></a>

  <section aria-label="Quick actions" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -12px 40px -16px rgba(21, 25, 35, 0.4)">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #D6E0E6; align-self: center"></div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; font-weight: 600">Quick actions</h2>
        <span style="font-size: 13px; color: #616775">The six things you do most. Reorder them in Settings.</span>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #F0F6F9; color: #151923; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.x}}"></path></svg></a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Search.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #0B4F79; color: #FFFFFF; text-decoration: none">

        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Collect fee</span><span style="font-size: 12px; color: #CFE3EE">Cash, UPI, cheque or bank</span></span>
      </a>
      <a href="Attendance.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E0E6; color: #151923; text-decoration: none">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EBF8F9; color: #0B5C65; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.calCheck}}"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Mark attendance</span><span style="font-size: 12px; color: #616775">Any class, today</span></span>
      </a>
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E0E6; color: #151923; font-family: inherit; text-align: left">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #F0F5FE; color: #1D48A5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.megaphone}}"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Send notice</span><span style="font-size: 12px; color: #616775">WhatsApp to parents or staff</span></span>
      </button>
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E0E6; color: #151923; font-family: inherit; text-align: left">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEFBF5; color: #1B5F3E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.userPlus}}"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Add student</span><span style="font-size: 12px; color: #616775">New admission</span></span>
      </button>
      <a href="Inbox.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E0E6; color: #151923; text-decoration: none">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #FEF7EB; color: #83470B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.swap}}"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Assign substitute</span><span style="font-size: 12px; color: #616775">Cover an absent teacher</span></span>
      </a>
      <a href="Student.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D6E0E6; color: #151923; text-decoration: none">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #F0F6F9; color: #151923; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.edit}}"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Add a note</span><span style="font-size: 12px; color: #616775">On a student or family</span></span>
      </a>
    </div>

    <a href="Student.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; border-radius: 14px; background: #F0F6F9; color: #151923; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#616775" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.clock}}"></path></svg>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #616775">Repeat last</span><span style="font-size: 14px; font-weight: 600">Collect fee · Aarav Sharma, Class 7</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#616775" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.chevRight}}"></path></svg>
    </a>
  </section>
</div>
</x-dc>

</html>
