<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom navigation bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Devanagari:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Primary navigation" style="width: 390px; height: 88px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #D6E0E6; padding: 6px 6px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; font-family: Inter, 'Noto Sans Devanagari', system-ui, sans-serif; color: #616775">
  <a href="Main.dc.html" aria-current="{{t.current}}" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: {{t.color}}; font-weight: {{t.weight}}">
    <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{t.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.home}}"></path></svg></span>Today</a>
  <a href="Search.dc.html" aria-current="{{s.current}}" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: {{s.color}}; font-weight: {{s.weight}}">
    <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{s.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.users}}"></path></svg></span>Students</a>
  <a href="QuickActions.dc.html" aria-label="Quick actions" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600; color: #0B4F79">
    <span style="width: 48px; height: 48px; border-radius: 24px; background: #0B4F79; color: #FFFFFF; box-shadow: 0 6px 18px -8px rgba(21, 25, 35, 0.45); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"></path></svg></span>Actions</a>
  <a href="Inbox.dc.html" aria-current="{{i.current}}" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: {{i.color}}; font-weight: {{i.weight}}">
    <span style="position: relative; width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{i.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.inbox}}"></path></svg>
      <sc-if value="{{hasCount}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: -3px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #B41D1D; color: #FFFFFF; border: 2px solid #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{count}}</span></sc-if>
    </span>Needs you</a>
  <a href="Menu.dc.html" aria-current="{{m.current}}" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; color: {{m.color}}; font-weight: {{m.weight}}">
    <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{m.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.grid}}"></path></svg></span>Menu</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","students","inbox","menu","none"],"default":"today"},"inboxCount":{"editor":"int","default":6,"min":0,"max":99},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const n = Number(this.props.inboxCount ?? 6) || 0;
    const tab = (key) => {
      const on = active === key;
      return {
        color: on ? '#0B4F79' : '#616775',
        weight: on ? '700' : '500',
        pill: on ? '#E3EDF2' : 'transparent',
        current: on ? 'page' : 'false'
      };
    };
    return {
      t: tab('today'),
      s: tab('students'),
      i: tab('inbox'),
      m: tab('menu'),
      count: n > 99 ? '99+' : String(n),
      hasCount: n > 0,
      ic: {
        home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
        users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
        plus: 'M12 5v14M5 12h14',
        inbox: 'M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z',
        grid: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z'
      }
    };
  }
}
</script>
</body>
</html>
