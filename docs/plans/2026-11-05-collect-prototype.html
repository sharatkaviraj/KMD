<title>VPPS Collect Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one card on a stage; desktop adds a ticket rail (left) and a child panel (right); phone swaps the rail for a strip. Nothing scrolls. */
:root{
  --bg:#F4F7FA;--card:#FFFFFF;--s2:#F0F6F9;--s3:#E3EDF2;--fg:#151923;--mut:#5C6270;--sub:#8A8E98;--bd:#DCE4EA;--bds:#ACC0CD;
  --pri:#0B4F79;--prifg:#FFFFFF;--acc:#0E717C;--accs:#E6F6F7;--accfg:#0B5C65;
  --ok:#1B5F3E;--oks:#E9F8F0;--okm:#CDEFDD;--warn:#A95C0F;--warns:#FEF5E7;--warnfg:#83470B;--warnm:#F6D9A8;
  --bad:#B41D1D;--bads:#FDEEEE;--info:#1D48A5;--infos:#EEF3FE;
  --ink:#4B2E9A;--inks:rgba(75,46,154,.11);
  --paper:#FFFDF7;--paperfg:#1E1B16;--papermut:#6B6457;--paperbd:#DDD5C4;--paperink:#4B2E9A;
  --slot:#1C222C;--scrim:rgba(8,20,30,.42);
  --sh:0 1px 2px rgba(21,25,35,.04),0 12px 28px -18px rgba(21,25,35,.28);
  --shl:0 30px 80px -24px rgba(8,20,30,.45);
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.36,.64,1);
  --f-ui:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Source Serif 4','Noto Sans Devanagari',Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117;--card:#161A22;--s2:#1C212B;--s3:#262C37;--fg:#F3F1EC;--mut:#B3AFA4;--sub:#8E8A80;--bd:#2A303B;--bds:#3B4250;
  --pri:#81DAE4;--prifg:#08202A;--acc:#81DAE4;--accs:#123139;--accfg:#A9E9F0;
  --ok:#5FCB97;--oks:#122A22;--okm:#1D4A37;--warn:#F2A85A;--warns:#2E2318;--warnfg:#F6C88F;--warnm:#5B3F1E;
  --bad:#F27E7E;--bads:#33191C;--info:#8FB0F5;--infos:#18213A;
  --ink:#B9A4FF;--inks:rgba(185,164,255,.14);
  --paper:#EDE9DE;--paperfg:#1E1B16;--papermut:#5F584C;--paperbd:#CFC7B4;--paperink:#4B2E9A;
  --slot:#05070A;--scrim:rgba(0,0,0,.55);
  --sh:0 1px 2px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.7);--shl:0 30px 80px -24px rgba(0,0,0,.85);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117;--card:#161A22;--s2:#1C212B;--s3:#262C37;--fg:#F3F1EC;--mut:#B3AFA4;--sub:#8E8A80;--bd:#2A303B;--bds:#3B4250;
  --pri:#81DAE4;--prifg:#08202A;--acc:#81DAE4;--accs:#123139;--accfg:#A9E9F0;
  --ok:#5FCB97;--oks:#122A22;--okm:#1D4A37;--warn:#F2A85A;--warns:#2E2318;--warnfg:#F6C88F;--warnm:#5B3F1E;
  --bad:#F27E7E;--bads:#33191C;--info:#8FB0F5;--infos:#18213A;
  --ink:#B9A4FF;--inks:rgba(185,164,255,.14);
  --paper:#EDE9DE;--paperfg:#1E1B16;--papermut:#5F584C;--paperbd:#CFC7B4;--paperink:#4B2E9A;
  --slot:#05070A;--scrim:rgba(0,0,0,.55);
  --sh:0 1px 2px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.7);--shl:0 30px 80px -24px rgba(0,0,0,.85);
  color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono)}
.hi{display:block;font-family:'Noto Sans Devanagari',var(--f-ui);font-size:.74em;font-weight:500;opacity:.82;line-height:1.25;margin-top:1px}
.hin{font-family:'Noto Sans Devanagari',var(--f-ui);font-weight:500;color:var(--mut);font-size:.88em;margin-left:6px}

.app{height:100%;max-height:var(--vvh,100%);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"head" "strip" "stage";position:relative}
@media (min-width:900px){.app{grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "rail stage"}}
@media (min-width:1180px){.app{grid-template-columns:236px minmax(0,1fr) 288px;grid-template-areas:"head head head" "rail stage ctx"}}

.head{grid-area:head;display:flex;align-items:center;gap:12px;height:58px;min-width:0}
.mark{width:34px;height:34px;border-radius:50%;background:var(--pri);color:var(--prifg);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px;flex:none}
.htitle{min-width:0;line-height:1.15}
.htitle b{display:block;font-size:15px;font-weight:700}
.htitle span{font-size:11.5px;color:var(--mut)}
.hspace{flex:1}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.sample{background:var(--inks);color:var(--ink)}
.pill.sess{background:var(--s3);color:var(--mut)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--s3);gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--sh)}
.gear{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;color:var(--mut)}
@media (max-width:899px){.head{height:52px;gap:8px}.htitle span,.pill.sess{display:none}.mark{width:30px;height:30px;font-size:12.5px}.seg button{padding:0 8px;height:28px}}
@media (max-width:420px){.pill.sample{display:none}}

.rail{grid-area:rail;display:none;flex-direction:column;gap:4px;padding:10px 14px 16px 0;min-height:0;overflow:hidden}
@media (min-width:900px){.rail{display:flex}}
.rail h3{margin:0 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.rail p{margin:0 0 10px;font-size:12px;color:var(--sub);line-height:1.4}
.ri{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:14px;border:0;background:transparent;text-align:left;width:100%;transition:background-color .2s ease,box-shadow .25s ease}
.ri:disabled{cursor:default}
.ri .dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bds);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut);transition:all .25s var(--ease)}
.ri.done .dot{background:var(--ok);border-color:var(--ok);color:var(--card)}
.ri.cur{background:var(--card);box-shadow:var(--sh)}
.ri.cur .dot{border-color:var(--pri);color:var(--pri);border-width:2px}
.ri .lab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.ri .val{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.ri .val.empty{color:var(--sub);font-weight:500}
.ri.done:not(:disabled):hover{background:var(--s2)}
.ri.opt .dot{border-style:dashed}
.pulse .dot{animation:pulse .5s var(--spring)}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

.strip{grid-area:strip;display:flex;align-items:center;gap:10px;height:38px;border:0;background:transparent;padding:0;text-align:left;width:100%;min-width:0}
@media (min-width:900px){.strip{display:none}}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:18px;height:5px;border-radius:3px;background:var(--s3);transition:background-color .3s ease,width .3s var(--ease)}
.dots i.done{background:var(--ok)}
.dots i.cur{background:var(--pri);width:26px}
.sum{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.strip .i{color:var(--sub)}

.stage{grid-area:stage;position:relative;min-height:0;min-width:0}
.card{position:absolute;inset:0;margin:auto;width:min(580px,100%);height:min(720px,calc(100% - 28px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);overflow:hidden;will-change:transform,opacity}
.card.leaving{pointer-events:none}
@media (max-width:899px){.card{height:calc(100% - 12px);margin:4px 0 8px;inset:0 0 auto 0;border-radius:20px}}
.ch{padding:20px 24px 4px;flex:none}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:3px}
.ch h2{margin:0;font-family:var(--f-disp);font-size:25px;line-height:1.15;font-weight:700;text-wrap:balance}
.ch h2 .hi{font-family:'Noto Sans Devanagari',var(--f-ui);font-size:14px;color:var(--mut);font-weight:500;opacity:1}
.cbody{flex:1;min-height:0;overflow:hidden;padding:12px 24px;display:flex;flex-direction:column;gap:11px;position:relative}
.cf{flex:none;padding:12px 16px 16px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--bd);transition:opacity .35s ease}
@media (max-width:899px){.ch{padding:13px 16px 2px}.eyebrow{display:none}.ch h2{font-size:21px}.ch h2 .hi{font-size:12.5px}.cbody{padding:8px 16px;gap:8px}.cf{padding:10px 12px 12px}}
[data-overflow]{outline:2px dashed var(--bad);outline-offset:-3px}

.btn{min-height:50px;border-radius:15px;padding:6px 18px;font-weight:700;font-size:15px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;border:0;transition:transform .14s var(--ease),filter .2s ease,opacity .2s ease;text-align:center}
.btn:active:not(:disabled){transform:scale(.97)}
.btn .hi{font-size:11.5px}
.btn.pri{background:var(--pri);color:var(--prifg);flex:1;min-width:0}
.btn.pri:hover:not(:disabled){filter:brightness(1.1)}
.btn.sec{background:var(--card);border:1px solid var(--bds);color:var(--fg)}
.btn.sec:hover:not(:disabled){background:var(--s2)}
.btn.icon{width:50px;padding:0;flex:none}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.42}
.k{font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:5px;border:1px solid var(--bd);background:var(--s2);color:var(--mut);line-height:1.4}
.hint{font-size:12px;color:var(--sub);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.phone .deskonly{display:none!important}
.desk .phoneonly{display:none!important}

/* who */
.search{display:flex;align-items:center;gap:10px;height:54px;border:1.5px solid var(--bds);border-radius:16px;padding:0 14px;background:var(--card);flex:none;transition:border-color .2s ease,box-shadow .2s ease}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:17px;color:var(--fg);min-width:0;height:100%}
.search input::placeholder{color:var(--sub)}
.search .i{color:var(--mut)}
.shape{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;min-height:18px;flex:none;font-weight:600}
.shape .i{color:var(--acc)}
.results{display:flex;flex-direction:column;gap:3px;min-height:0;flex:1;overflow:hidden}
.res{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:14px;border:1.5px solid transparent;background:transparent;text-align:left;width:100%;transition:background-color .15s ease,border-color .15s ease;flex:none}
.res:hover{background:var(--s2)}
.res.hl{background:var(--accs);border-color:var(--acc)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.av0{background:var(--accs);color:var(--accfg)}.av1{background:var(--warns);color:var(--warnfg)}.av2{background:var(--infos);color:var(--info)}.av3{background:var(--oks);color:var(--ok)}.av4{background:var(--inks);color:var(--ink)}
.rc{min-width:0;display:flex;flex-direction:column;gap:1px}
.rn{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
.ra b{font-size:14.5px}
.okc{color:var(--ok)}
.latec{font-size:11.5px;color:var(--warnfg);font-weight:600}
.tag{display:inline-flex;align-self:flex-start;align-items:center;min-height:19px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.warn{background:var(--warns);color:var(--warnfg)}.tag.info{background:var(--infos);color:var(--info)}.tag.acc{background:var(--accs);color:var(--accfg)}.tag.mut{background:var(--s3);color:var(--mut)}
.more{font-size:12.5px;color:var(--mut);padding:2px 10px;flex:none}
.empty-s{margin:auto;text-align:center;color:var(--mut);max-width:30ch;line-height:1.5}
.hh{font-size:12.5px;font-weight:700;color:var(--accfg);background:var(--accs);border-radius:12px;padding:6px 6px 6px 12px;display:flex;gap:8px;align-items:center;flex:none;justify-content:space-between}
.hh>span{display:flex;gap:8px;align-items:center;min-width:0}

/* dues */
.who{display:flex;gap:12px;align-items:center;flex:none;min-width:0}
.who .av{width:50px;height:50px;font-size:17px}
.who .nm{font-family:var(--f-disp);font-size:22px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .meta{font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div{min-width:0}
.flags{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.flag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;line-height:1.3}
.flag.warn{background:var(--warns);color:var(--warnfg)}.flag.info{background:var(--infos);color:var(--info)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.tile{border-radius:14px;background:var(--s2);padding:8px 12px;min-width:0}
.tile .lab{font-size:11.5px;color:var(--mut);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-family:var(--f-disp);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .sub{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.late .val{color:var(--warn)}
.tile.late.zero .val{color:var(--sub)}
.lrow{display:flex;align-items:center;gap:8px;border-radius:14px;background:var(--warns);padding:6px 6px 6px 12px;flex:none;min-width:0}
.lrow .lt{font-size:13px;font-weight:700;color:var(--warnfg);flex:1;min-width:0;line-height:1.25}
.lrow .lt small{display:block;font-weight:500;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .seg{background:var(--card);flex:none}
.lrow .seg button.on{background:var(--warn);color:var(--card)}
.rsn{border:0;background:transparent;color:var(--warnfg);font-size:11.5px;font-weight:700;padding:0;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;white-space:nowrap}
.fam{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 12px;border-radius:14px;border:1.5px dashed var(--bds);background:transparent;text-align:left;width:100%;flex:none;transition:all .2s var(--ease)}
.fam.on{border-style:solid;border-color:var(--acc);background:var(--accs)}
.cbx{width:20px;height:20px;border-radius:6px;border:2px solid var(--bds);display:grid;place-items:center;color:transparent;transition:all .2s var(--ease)}
.fam.on .cbx{background:var(--acc);border-color:var(--acc);color:var(--card)}
.fam .fn{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam .fs{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam b{font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.fam b small{display:block;font-size:11px;color:var(--warnfg);font-weight:600}
.rcpts{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.rcpts h5{margin:0 0 2px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;flex:none}
.rcpts h5 span{text-transform:none;letter-spacing:0;font-weight:600;color:var(--sub)}
.rcl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;padding:5px 2px;border-top:1px solid var(--bd);flex:none}
.rcl .mono{font-size:11px;color:var(--mut)}
.rcl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.rcl b{font-variant-numeric:tabular-nums}
.rcl.today{background:var(--warns);border-radius:8px;border-top-color:transparent}
.clear{margin:6px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.clear .big{width:56px;height:56px;border-radius:50%;background:var(--oks);color:var(--ok);display:grid;place-items:center}
.clear h3{margin:0;font-family:var(--f-disp);font-size:20px}
.clear p{margin:0;color:var(--mut);font-size:13px}

/* year bar */
.yb{display:flex;gap:4px;flex:none}
.ys{min-width:0;display:flex;flex-direction:column;gap:4px}
.bar{height:12px;border-radius:6px;background:var(--s3);overflow:hidden;display:flex;position:relative}
.bar.od{background:var(--warns);box-shadow:inset 0 0 0 1px var(--warnm)}
.bar>i{display:block;height:100%;transition:width .32s var(--ease);flex:none}
.bar .p{background:var(--ok)}
.bar .n{background-color:var(--acc);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px);background-size:14px 14px;animation:stripes .9s linear infinite}
@keyframes stripes{to{background-position:14px 0}}
.sl{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sl.od{color:var(--warnfg)}.sl.ok{color:var(--ok)}.sl.n{color:var(--accfg)}
.yb.slim .sl{display:none}
.yb.slim .bar{height:9px}

/* amount */
.amtbox{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.amt{display:flex;align-items:baseline;justify-content:center;gap:4px;font-family:var(--f-disp);font-weight:700;font-size:62px;font-variant-numeric:tabular-nums;line-height:1}
.amt .cur{font-size:.5em;color:var(--mut)}
.amt.empty .v{color:var(--sub)}
.amt .caret{width:3px;height:.8em;background:var(--acc);border-radius:2px;align-self:center;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.amt.bad .v{color:var(--bad)}
.amt .of{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--mut);margin-left:6px}
.words{text-align:center;font-size:12.5px;color:var(--mut);min-height:16px;line-height:1.3;max-width:46ch}
.words .hi{font-size:12px}
.dyn{display:flex;flex-direction:column;gap:8px;flex:none;min-height:0}

   case 'pickhl':{const r=S._res&&S._res[S.hl];if(r)pick(r.s,false);break}
   case 'next':next();break;case 'back':goBack();break;
   case 'sub':swapSub(v);break;
   case 'late':S.late.choice=v;refresh();break;
   case 'reason':{const i=REASONS.findIndex(r=>r[0]===S.late.reason);S.late.reason=REASONS[(i+1)%REASONS.length][0];refresh();break}
   case 'fam':{const id=b.dataset.id;S.fam=S.fam.includes(id)?S.fam.filter(x=>x!==id):[...S.fam,id];if(!famOn())S.rule='oldest';refresh();break}
   case 'chip':{const from=total();S.amount=String(v);updAmount(from);break}
   case 'rule':{if(v==='manual'&&S.rule!=='manual'){dist().forEach(d=>S.manual[d.st.id]=d.amt);S.focus=S.fam[0]}if(v!=='manual'&&S.rule==='manual')S.amount=String(total()||'');S.rule=v;updAmount(false);break}
   case 'focus':S.focus=b.dataset.id;updAmount(false);break;
   case 'key':typeKey(v);break;
   case 'mode':S.mode=v;if(v!=='split')store.set('mode',v);S.cash.received=null;S.cash.notes=null;refresh();break;
   case 'recv':S.cash.received=+v;S.cash.notes=null;refresh();break;
   case 'spcash':S.sp.cash=+v;refresh();break;
   case 'note':{S.cash.notes=S.cash.notes||{};const d=+b.dataset.d;S.cash.notes[d]=Math.max(0,(S.cash.notes[d]||0)+(+v));S.cash.received=DEN.reduce((t,x)=>t+x*(S.cash.notes[x]||0),0);refresh();break}
   case 'bankpick':S.chq.bank=v;refresh();break;
   case 'day':S.date=v;refresh();break;
   case 'calday':S.date=v;swapSub('');break;
   case 'calm':{const[y,m]=S.calMonth.split('-').map(Number);S.calMonth=iso(Date.UTC(y,m-1+(+v),1)).slice(0,7);refresh();break}
   case 'goto':{$('.ovl')?.remove();gotoStep(b.dataset.s);break}
   case 'nextstudent':{const m=S.mode;clearInterval(UT);S=fresh();S.mode=m==='split'?'cash':m;go('who',1);break}
   case 'sibling':{const s=byId(b.dataset.id),m=S.mode;clearInterval(UT);S=fresh();S.mode=m==='split'?'cash':m;S.st=s;S.fam=[s.id];S.focus=s.id;S.done.add('who');go('dues',1);break}
   case 'print':toast(L('In One this prints on A4 or the 80 mm counter printer.','One में यह A4 या 80 mm काउंटर प्रिंटर पर छपता है।'));break;
   case 'notice':toast(L('The Fees app sends the WhatsApp receipt notice when it is switched on. One never sends a second one.','Fees ऐप चालू होने पर WhatsApp रसीद सूचना भेजता है। One दूसरी नहीं भेजता।'));break;
   case 'undo':undo();break;
   case 'ticket':openTicket();break;case 'closeovl':$('.ovl')?.remove();break;
   case 'lang':prefs.lang=b.dataset.l;store.set('lang',prefs.lang);refresh();break;
   case 'demo':demoPanel();break;
   case 'role':prefs.role=v;store.set('role',v);S.late.choice=null;$('.demo').remove();demoPanel();refresh();break;
   case 'toggle':{const k=b.dataset.t;prefs[k]=!prefs[k];if(k!=='lost'&&k!=='rm')store.set(k,prefs[k]);if(k==='sound'&&prefs.sound){ac();thunk()}b.classList.toggle('on',prefs[k]);if(k==='smart')refresh();break}
   case 'reset':STU=JSON.parse(INIT);RECENT=['vi'];SEQNO=7;FPNO=1;S=fresh();$('.demo')?.remove();go('who',-1);toast('Sample data reset.');break;
  }});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.q=t.value;S.hl=0;const el=$('.card.live'),d=STEPS.who(),tmp=document.createElement('div');tmp.innerHTML=d.body;$('#results',el).replaceWith($('#results',tmp));$('#shape',el).innerHTML=$('#shape',tmp).innerHTML;const hh=$('.hh',el),nh=$('.hh',tmp);if(hh)hh.remove();if(nh)$('#shape',el).after(nh);$('.cf',el).innerHTML=d.foot;fitList(el);fitCheck()}
  if(t.id==='utr'){S.upi.utr=t.value.replace(/\D/g,'');t.value=S.upi.utr}
  if(t.id==='chq'){S.chq.no=t.value.replace(/\D/g,'').slice(0,6);t.value=S.chq.no;payBtn()}
  if(t.id==='chqd'){let d=t.value.replace(/\D/g,'').slice(0,8);if(d.length>4)d=d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);else if(d.length>2)d=d.slice(0,2)+'/'+d.slice(2);S.chq.date=d;t.value=d}
  if(t.id==='ref'){S.bank.ref=t.value;payBtn()}
  if(t.id==='spcash'){const d=t.value.replace(/\D/g,'').slice(0,7);t.value=d;S.sp.cash=d===''?null:+d;const tot=total(),cs=S.sp.cash,up=cs==null?null:tot-cs;$('#spupi').textContent=up==null?'—':up>0?fmt(up):'—';const ts=$('#tsum');const ok=cs!=null&&cs>0&&cs<tot;ts.className='tsum '+(ok?'ok':cs!=null?'bad':'');ts.lastElementChild.textContent=ok?`${fmt(cs)} + ${fmt(up)} = ${fmt(tot)} ✓`:cs!=null&&cs>=tot?P('Cash covers it all — choose Cash instead','पूरा नकद है — नकद चुनें'):fmt(tot);$$('[data-act="spcash"]').forEach(c=>c.classList.toggle('on',+c.dataset.v===cs));payBtn()}
  if(t.id==='ack'){S.ack=t.checked;$('#hold').disabled=!S.ack}});
function payBtn(){const b=$('#paynext')||$('.card.live[data-step="pay"] #hold');if(b)b.disabled=!payOK()}

document.addEventListener('keydown',e=>{
  if(SEQ){if(SEQ.phase==='show'&&!e.repeat)skip();e.preventDefault();return}
  if($('.demo')&&e.key==='Escape'){$('.demo').remove();return}
  if($('.ovl')&&e.key==='Escape'){$('.ovl').remove();return}
  const st=S.step,inField=!!(e.target.matches&&e.target.matches('input:not([type=checkbox]),textarea')),k=e.key;
  if(k==='Escape'&&st!=='who'){e.preventDefault();goBack();return}
  if(st==='who'){
    if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();const vis=$$('.card.live .res').length;if(!vis)return;S.hl=(S.hl+(k==='ArrowDown'?1:-1)+vis)%vis;$$('.card.live .res').forEach((r,i)=>r.classList.toggle('hl',i===S.hl));return}
    if(k==='Enter'){e.preventDefault();const r=S._res&&S._res[S.hl];if(r)pick(r.s,false);return}
    if(!inField&&k.length===1&&!e.ctrlKey&&!e.metaKey)$('#q')?.focus();return}
  if(st==='dues'){if(k==='Enter'){e.preventDefault();next()}else if((k==='w'||k==='W')&&canWaive()&&lateAll()){S.late.choice='waive';refresh()}else if((k==='c'||k==='C')&&canWaive()&&lateAll()){S.late.choice='collect';refresh()}return}
  if(st==='amount'){
    if(/^\d$/.test(k)){e.preventDefault();typeKey(k);return}
    if(k==='Backspace'){e.preventDefault();typeKey('⌫');return}
    if(k==='Tab'&&manual()){e.preventDefault();const i=S.fam.indexOf(S.focus);S.focus=S.fam[(i+1)%S.fam.length];updAmount(false);return}
    const lk=k.toLowerCase();if('onyl'.includes(lk)&&lk.length===1&&!manual()){const c=chips().find(x=>x.k.toLowerCase()===lk);if(c){e.preventDefault();const from=total();S.amount=String(c.v);updAmount(from)}return}
    if(k==='Enter'){e.preventDefault();next()}return}
  if(st==='pay'){if(S.sub){if(k==='Enter'&&!inField){e.preventDefault();swapSub('')}return}
    const m={F1:'cash',F2:'upi',F3:'bank',F4:'cheque',F5:'split'};if(m[k]){e.preventDefault();S.mode=m[k];if(m[k]!=='split')store.set('mode',m[k]);S.cash.received=null;S.cash.notes=null;refresh();return}
    if(!inField&&(k==='ArrowLeft'||k==='ArrowRight')){e.preventDefault();const nd=addDays(S.date,k==='ArrowLeft'?-1:1);if(nd<=TODAY&&nd>=SESSION_START){S.date=nd;refresh()}return}
    if(!inField&&(k==='t'||k==='T')){S.date=TODAY;refresh();return}
    if((k==='Enter'||k===' ')&&!e.repeat&&(!inField||k==='Enter')){const h=$('.card.live #hold');if(h){e.preventDefault();h._start&&h._start();return}if(k==='Enter'){e.preventDefault();next()}}return}
  if(st==='review'){if((k==='Enter'||k===' ')&&!e.repeat&&!inField){e.preventDefault();const h=$('#hold');h&&h._start&&h._start()}return}
  if(st==='sealed'){if(k==='n'||k==='N'||k==='Enter'){e.preventDefault();$('[data-act="nextstudent"]')?.click()}return}
});
document.addEventListener('keyup',e=>{if((S.step==='review'||S.step==='pay')&&(e.key==='Enter'||e.key===' ')){const h=$('.card.live #hold');h&&h._stop&&h._stop()}});

const vv=window.visualViewport;
function onVV(){if(vv)document.documentElement.style.setProperty('--vvh',vv.height+'px');document.body.classList.toggle('phone',isPhone());document.body.classList.toggle('desk',!isPhone())}
if(vv)vv.addEventListener('resize',()=>{onVV();fitCheck()});
let RZ=null;addEventListener('resize',()=>{clearTimeout(RZ);RZ=setTimeout(()=>{onVV();if(!SEQ)refresh()},120)});
onVV();go('who',1);
})();
</script>
