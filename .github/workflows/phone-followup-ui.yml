name: Phone follow-up UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: phone-followup-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  targeted-phone:
    runs-on: ubuntu-latest
    # Keep all matrix check identities; reuse the version-matched browsers/OS.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [export-followup.playwright.config.ts, cheque-followup.playwright.config.ts, module-followup.playwright.config.ts, fee-followup.playwright.config.ts, class-followup.playwright.config.ts, academic-followup.playwright.config.ts, student360-sibling.playwright.config.ts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify preinstalled browser version matches lockfile
        run: node -e "const v=require('@playwright/test/package.json').version; if(v !== '1.63.0') throw new Error('Update the Playwright container to match '+v)"
      - name: Targeted touch component checks
        run: |
          if [ "${{ matrix.config }}" = "class-followup.playwright.config.ts" ]; then
            npx vite build --config tests/class-followup/vite.config.ts
            export PHONEOPS_CLASS_STATIC_DIR="../evidence/class-followup-static"
          fi
          if [ "${{ matrix.config }}" = "student360-sibling.playwright.config.ts" ]; then
            npx vite build --config tests/sibling-context/vite.config.ts
            export PHONEOPS_SIBLING_STATIC_DIR="../evidence/sibling-context-static"
          fi
          npx playwright test --config tests/playwright/${{ matrix.config }}
      - name: Collect safe generated follow-up evidence
        if: always()
        run: |
          mkdir -p .playwright/followup-evidence
          find ../evidence -maxdepth 1 -type f -name '*followup*' ! -name '*admin*' ! -name '*server*' -exec cp {} .playwright/followup-evidence/ \; 2>/dev/null || true
          find ../evidence -maxdepth 1 -type f -name '*sibling-context*' -exec cp {} .playwright/followup-evidence/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-${{ matrix.config }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .playwright/
            test-results/
            .test-artifacts/fee-followup/
