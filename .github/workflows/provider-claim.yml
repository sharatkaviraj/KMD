name: Provider claim concurrency
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: provider_claim_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d provider_claim_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - name: Prove durable cross-request claim on disposable PostgreSQL
        run: python tests/sql/provider-claim.py
        env:
          CLAIM_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/provider_claim_ci
