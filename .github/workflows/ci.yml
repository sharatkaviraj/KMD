name: CI

# Everything `npm run check` runs locally, run again on every PR — because the
# merge is the agent's own (D-7), and CI being green is the only thing standing
# between a branch and production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The two gates the fee port added. `check:port` re-runs the import
      # codemod and fails if anything is left to rewrite — it has caught
      # three silent breakages already, each of which compiled cleanly:
      # this app's own repos reading the fee schema, its shell reading the
      # fee navigation map, and a deliberate fix being rewritten back.
      - name: Ported imports
        run: npm run check:port

      # Skips with a message when the School Fees checkout is absent, which
      # on a CI runner it always is. Kept in the pipeline anyway so the step
      # exists the day somebody checks both repos out — a gate people only
      # run locally is a gate that stops being run.
      - name: Theme parity
        run: npm run check:theme

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholders. The build must not reach a database, and it does not
          # need to: every page that reads one is dynamic. Real values would
          # also mean a service-role key in CI, which is worth avoiding for a
          # job that only compiles.
          #
          # These must not trip the placeholder guard in src/platform/env.ts —
          # that guard exists to catch a `YOUR_PROJECT_ID` left in a real
          # deployment, and a build failing on its own fixture is noise.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-only.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
          NEXT_PUBLIC_SCHOOL_NAME: Shri Veer Patta Senior Secondary School
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # next build type-checks the whole tree again inside one process, and
          # on 11 Oct 2026 that crossed Node's default ~2 GB heap and died with
          # "heap out of memory". The runner has 16 GB; Typecheck above is the
          # real gate, this only lets the build's copy finish.
          NODE_OPTIONS: --max-old-space-size=6144
          VPPSONE_ENV: dev

      - name: Route bundle budgets
        run: npm run check:bundles
