name: Phone operations UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: phone-operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phone:
    runs-on: ubuntu-latest
    # Keep all matrix check identities; reuse the version-matched browsers/OS.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [student360-mobile.playwright.config.ts, student-profile.playwright.config.ts, academic-ui.playwright.config.ts, operations-admin.playwright.config.ts, accountant-mobile.playwright.config.ts, marks-mobile.playwright.config.ts, operations-fee-collector.playwright.config.ts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify preinstalled browser version matches lockfile
        run: node -e "const v=require('@playwright/test/package.json').version; if(v !== '1.63.0') throw new Error('Update the Playwright container to match '+v)"
      - name: Synthetic phone acceptance (no DB credentials)
        run: npx playwright test --config tests/playwright/${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-${{ matrix.config }}
          path: |
            .playwright/
            test-results/
            .test-artifacts/operations-fee-collector/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
