name: Payment parity UI

on:
  pull_request:
    paths:
      - "src/vx/screens/payments/**"
      - "src/modules/payments/**"
      - "src/platform/drafts/**"
      - "src/app/(app)/payments/**"
      - "tests/payment-ui/**"
      - "tests/payment-parity*"
      - "tests/playwright/payment-ui.playwright.config.ts"
      - "tests/playwright/root.ts"
      - ".github/workflows/payment-parity-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only obsolete PR test runs may be cancelled; main/manual runs stay independent.
concurrency:
  group: payment-parity-ui-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config tests/playwright/payment-ui.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-parity-browser-evidence
          path: test-results/
          retention-days: 7
