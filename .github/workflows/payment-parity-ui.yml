name: Payment parity UI

on:
  pull_request:
    paths:
      - "src/vx/screens/payments/**"
      - "src/modules/payments/**"
      - "src/app/(app)/payments/**"
      - "tests/payment-ui/**"
      - "tests/payment-parity*"
      - "payment-ui.playwright.config.ts"
      - ".github/workflows/payment-parity-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config payment-ui.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-parity-browser-evidence
          path: test-results/
          retention-days: 7
